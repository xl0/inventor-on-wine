<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The stock session bus plus no AppArmor: in the sandbox its policy query fails with
     "Read-only file system" and every client (gnome-shell, pipewire) fails to connect. -->
<busconfig>
  <apparmor mode="disabled"/>
  <include>/usr/share/dbus-1/session.conf</include>
</busconfig>
