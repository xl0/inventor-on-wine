# Headless Xorg on one NVIDIA GPU (ca:00.0 = PCI:202:0:0), no monitor attached.
Section "ServerLayout"
    Identifier "L"
    Screen "S"
    Option "AutoAddDevices" "false"
EndSection
Section "Device"
    Identifier "D"
    Driver "nvidia"
    BusID "PCI:202:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
    Option "ProbeAllGpus" "false"
EndSection
Section "Screen"
    Identifier "S"
    Device "D"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
